[package]
name = "harness-seed"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Embeddable ReAct harness — context, tools, and pluggable LLM brains (not another chat UI)"
autobins = true
autoexamples = false
autotests = true
autobenches = true

[features]
default = ["mempalace"]
## mempalace HTTP アダプタ（`memory.provider: "mempalace"`）。外すと本体は noop/local のみ。
mempalace = ["dep:mempalace-adapter"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
mempalace-adapter = { path = "adapters/mempalace-adapter", optional = true }

[[test]]
name = "brain-plan"
path = "tests/brain-plan/main.rs"
